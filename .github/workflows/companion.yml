# Builds the Puppy Companion desktop app (Windows) and self-tests the built program.
# The zip is attached to each run as the artifact "PuppyCompanion-win64".
name: Puppy Companion

on:
  push:
    paths:
      - "companion/**"
      - ".github/workflows/companion.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: companion
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests (logic, window, updater)
        run: python -m unittest discover -s tests -v

      - name: payload.json is current
        shell: pwsh
        run: |
          python tools/make_payload.py
          git diff --exit-code payload.json
          if ($LASTEXITCODE -ne 0) { throw "payload.json is stale: run 'python companion/tools/make_payload.py' and commit it" }

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          python -m PyInstaller --version

      - name: Build
        run: pyinstaller --noconfirm --clean --windowed --name PuppyCompanion --icon assets\PuppyCompanion.ico --paths . --add-data "puppy_companion\fonts;puppy_companion\fonts" --add-data "puppy_companion\cursors;puppy_companion\cursors" run_companion.py

      - name: Self-test the built program
        shell: pwsh
        timeout-minutes: 3
        run: |
          $p = Start-Process -FilePath "dist\PuppyCompanion\PuppyCompanion.exe" -ArgumentList "--selftest","selftest.txt" -Wait -PassThru
          if (Test-Path selftest.txt) { Get-Content selftest.txt } else { Write-Host "no report written" }
          if ($p.ExitCode -ne 0) { throw "self-test failed (exit code $($p.ExitCode))" }

      - name: Zip
        shell: pwsh
        run: |
          Copy-Item README.md dist\PuppyCompanion\README.md
          Compress-Archive -Path dist\PuppyCompanion -DestinationPath PuppyCompanion-win64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: PuppyCompanion-win64
          path: |
            companion/PuppyCompanion-win64.zip
            companion/selftest.txt
          if-no-files-found: error
