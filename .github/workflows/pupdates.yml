# Builds Pupdates for Windows and self-tests the built program, and tests the relay.
# The zip is attached to each run as the artifact "Pupdates-win64".
name: Pupdates (Windows)

on:
  push:
    paths:
      - "pupdates/pupdates_app/**"
      - "pupdates/relay/**"
      - "pupdates/tests/**"
      - "pupdates/run_pupdates.py"
      - "pupdates/Pupdates.ico"
      - "pupdates/tagfonts/**"
      - ".github/workflows/pupdates.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Relay tests
        run: node --test pupdates/relay/test/worker.test.mjs pupdates/relay/test/mod.test.mjs

  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pupdates
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pillow (the tag preview draws with it)
        run: python -m pip install "pillow>=10,<12"

      - name: Tests
        run: python -m unittest discover -s tests -v

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pyinstaller>=6.10,<7"

      - name: Stamp the build number (the Update button compares it)
        shell: pwsh
        run: Set-Content -Path pupdates_app/_build.py -Value "BUILD = $env:GITHUB_RUN_NUMBER"

      - name: Build
        run: pyinstaller --noconfirm --clean --onefile --windowed --name Pupdates --icon Pupdates.ico --paths . --add-data "tagfonts;tagfonts" run_pupdates.py

      - name: Self-test the built program
        shell: pwsh
        timeout-minutes: 3
        run: |
          $p = Start-Process -FilePath "dist\Pupdates.exe" -ArgumentList "--selftest","selftest.txt" -Wait -PassThru
          if (Test-Path selftest.txt) { Get-Content selftest.txt } else { Write-Host "no report written" }
          if ($p.ExitCode -ne 0) { throw "self-test failed (exit code $($p.ExitCode))" }

      - name: Zip
        shell: pwsh
        run: |
          Copy-Item README.md dist\README.md
          Compress-Archive -Path dist\Pupdates.exe, dist\README.md -DestinationPath Pupdates-win64.zip

      - name: Update info
        shell: pwsh
        run: |
          $h = (Get-FileHash dist\Pupdates.exe -Algorithm SHA256).Hash.ToLower()
          $n = (Get-Item dist\Pupdates.exe).Length
          @{ build = [int]$env:GITHUB_RUN_NUMBER; sha256 = $h; size = $n; commit = $env:GITHUB_SHA } | ConvertTo-Json | Set-Content dist\pupdates-windows.json

      - name: Publish for the Update button
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=pupdates-windows-latest
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$GITHUB_SHA" --prerelease \
            --title "Pupdates for Windows" --notes "The newest Pupdates.exe (the app's Update button reads this release)."
          gh release upload "$TAG" dist/Pupdates.exe dist/pupdates-windows.json --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: Pupdates-win64
          path: |
            pupdates/Pupdates-win64.zip
            pupdates/selftest.txt
          if-no-files-found: error
