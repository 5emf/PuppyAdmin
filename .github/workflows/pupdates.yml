# Builds Pupdates for Windows and self-tests the built program, and tests the relay.
# The zip is attached to each run as the artifact "Pupdates-win64".
name: Pupdates (Windows)

on:
  push:
    paths:
      - "pupdates/pupdates_app/**"
      - "pupdates/relay/**"
      - "pupdates/tests/**"
      - "pupdates/run_pupdates.py"
      - "pupdates/Pupdates.ico"
      - ".github/workflows/pupdates.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Relay tests
        run: node --test pupdates/relay/test/worker.test.mjs

  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pupdates
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests
        run: python -m unittest discover -s tests -v

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pyinstaller>=6.10,<7"

      - name: Build
        run: pyinstaller --noconfirm --clean --onefile --windowed --name Pupdates --icon Pupdates.ico --paths . run_pupdates.py

      - name: Self-test the built program
        shell: pwsh
        timeout-minutes: 3
        run: |
          $p = Start-Process -FilePath "dist\Pupdates.exe" -ArgumentList "--selftest","selftest.txt" -Wait -PassThru
          if (Test-Path selftest.txt) { Get-Content selftest.txt } else { Write-Host "no report written" }
          if ($p.ExitCode -ne 0) { throw "self-test failed (exit code $($p.ExitCode))" }

      - name: Zip
        shell: pwsh
        run: |
          Copy-Item README.md dist\README.md
          Compress-Archive -Path dist\Pupdates.exe, dist\README.md -DestinationPath Pupdates-win64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Pupdates-win64
          path: |
            pupdates/Pupdates-win64.zip
            pupdates/selftest.txt
          if-no-files-found: error
